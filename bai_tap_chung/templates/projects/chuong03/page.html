{% extends "base.html" %}
{% block title %}{{ title }} · Sổ điểm{% endblock %}
{% block content %}
  <div class="mx-auto max-w-5xl">
    <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
      <div><p class="text-sm font-semibold uppercase tracking-wider text-indigo-700">Chương 03 · Sổ điểm</p><h1 class="mt-1 text-2xl font-bold text-slate-950">{{ title }}</h1></div>
      <nav class="flex flex-wrap gap-2 text-sm" aria-label="Điều hướng sổ điểm">
        <a class="rounded-lg border border-slate-200 bg-white px-3 py-2 hover:border-indigo-400" href="{{ url_for('chuong03.home') }}">Tổng quan</a>
        <a class="rounded-lg border border-slate-200 bg-white px-3 py-2 hover:border-indigo-400" href="{{ url_for('chuong03.student_list') }}">Sinh viên</a>
        <a class="rounded-lg border border-slate-200 bg-white px-3 py-2 hover:border-indigo-400" href="{{ url_for('chuong03.search_student') }}">Tìm kiếm</a>
      </nav>
    </div>
    <section class="overflow-x-auto rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="space-y-4 text-sm leading-6 text-slate-700 [&_a]:font-medium [&_a]:text-indigo-700 [&_a:hover]:underline [&_table]:w-full [&_table]:border-collapse [&_td]:border [&_td]:border-slate-200 [&_td]:p-2 [&_th]:border [&_th]:border-slate-200 [&_th]:bg-slate-100 [&_th]:p-2 [&_ul]:list-disc [&_ul]:pl-5">{{ body|safe }}</div>
    </section>
  </div>
{% endblock %}
