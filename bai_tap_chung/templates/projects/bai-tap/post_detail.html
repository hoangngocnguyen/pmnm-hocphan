{% extends "base.html" %}
{% block title %}{{ post.title }} · Bài viết{% endblock %}
{% block content %}
  <article class="mx-auto max-w-3xl rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-10">
    <span class="inline-flex rounded-full bg-indigo-50 px-3 py-1 text-xs font-semibold text-indigo-700">Bài viết · #{{ post.id }}</span>
    <h1 class="mt-4 text-3xl font-bold tracking-tight text-slate-950">{{ post.title }}</h1>
    <p class="mt-3 border-b border-slate-100 pb-5 text-sm text-slate-500">Tác giả: <span class="font-semibold text-slate-700">{{ post.author }}</span></p>
    <div class="mt-6 whitespace-pre-line leading-7 text-slate-700">{{ post.content }}</div>
    <a class="mt-8 inline-block text-sm font-semibold text-indigo-700 hover:underline" href="{{ url_for('buoi4.buoi4') }}">← Quay lại bài tập</a>
  </article>
{% endblock %}
