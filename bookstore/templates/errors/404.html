{% extends "layouts/base.html" %}

{% block title %}Không tìm thấy trang (404){% endblock %}

{% block content %}
<div class="error-page d-flex flex-column align-items-center justify-content-center text-center px-3">

        🔍
    </div>
    <h1 class="h2 fw-bold">404 - Không tìm thấy trang</h1>

        Trang bạn đang tìm kiếm không tồn tại hoặc đã được di chuyển.
    </p>
    <div class="d-flex gap-2">
        <a href="{{ url_for('shop.index') }}" class="btn btn-brand">
            Về trang chủ
        </a>
        <a href="javascript:history.back()" class="btn btn-light border">
            Quay lại
        </a>

</div>
{% endblock %}
