<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Cà phê Sông Hương{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body { min-height: 100vh; display: flex; flex-direction: column; background: #f8f5f0; }
      main { flex: 1; width: 100%; }
      {% block styles %}{% endblock %}
    </style>
  </head>
  <body>
    <nav
      class="navbar navbar-expand navbar-dark bg-dark"
      aria-label="Điều hướng chính"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">Cà phê Sông Hương</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/">Trang chủ</a>
          <a class="nav-link" href="/menu">Menu</a>
          <a class="nav-link" href="/contact">Liên hệ</a>
        </div>
      </div>
    </nav>
    <main class="container py-4">{% block content %}{% endblock %}</main>
    <footer class="bg-dark text-light py-3 mt-5">
      <div class="container text-center small">
        <div>&copy; 2026 Nguyễn Ngọc Huy Hoàng. All rights reserved.</div>
      </div>
    </footer>
  </body>
</html>
