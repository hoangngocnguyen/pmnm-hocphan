<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Máy tính</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased"
  >
    <main
      class="w-full max-w-sm bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-6"
    >
      <header class="text-center">
        <h1 class="text-xl font-bold text-slate-800">Máy tính</h1>
        <p class="text-xs text-slate-400 mt-1">Nhập hai số và chọn phép toán</p>
      </header>

      <form method="POST" class="space-y-4">
        <div>
          <label
            for="numA"
            class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider"
            >Số a</label
          >
          <input
            type="text"
            inputmode="decimal"
            id="numA"
            name="a"
            placeholder="Ví dụ: 7,5"
            value="{{ a }}"
            required
            aria-describedby="errorA"
            class="w-full px-3.5 py-2.5 bg-slate-50 border {% if errors.a %}border-red-500{% else %}border-slate-200{% endif %} rounded-lg text-sm text-slate-800 focus:outline-none focus:border-indigo-500"
          />
          {% if errors.a %}
          <p id="errorA" class="mt-1 text-xs text-red-600">{{ errors.a }}</p>
          {% endif %}
        </div>

        <div>
          <label
            for="operation"
            class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider"
            >Phép toán</label
          >
          <select
            id="operation"
            name="op"
            aria-describedby="errorOp"
            class="w-full px-3.5 py-2.5 bg-slate-50 border {% if errors.op %}border-red-500{% else %}border-slate-200{% endif %} rounded-lg text-sm text-slate-800 focus:outline-none focus:border-indigo-500"
          >
            <option value="+" {% if op == '+' %}selected{% endif %}>
              Cộng (+)
            </option>
            <option value="-" {% if op == '-' %}selected{% endif %}>
              Trừ (−)
            </option>
            <option value="*" {% if op == '*' %}selected{% endif %}>
              Nhân (×)
            </option>
            <option value="/" {% if op == '/' %}selected{% endif %}>
              Chia (÷)
            </option>
            <option value="%" {% if op == '%' %}selected{% endif %}>
              Chia lấy dư (%)
            </option>
          </select>
          {% if errors.op %}
          <p id="errorOp" class="mt-1 text-xs text-red-600">{{ errors.op }}</p>
          {% endif %}
        </div>

        <div>
          <label
            for="numB"
            class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider"
            >Số b</label
          >
          <input
            type="text"
            inputmode="decimal"
            id="numB"
            name="b"
            placeholder="Ví dụ: 2"
            value="{{ b }}"
            required
            aria-describedby="errorB"
            class="w-full px-3.5 py-2.5 bg-slate-50 border {% if errors.b %}border-red-500{% else %}border-slate-200{% endif %} rounded-lg text-sm text-slate-800 focus:outline-none focus:border-indigo-500"
          />
          {% if errors.b %}
          <p id="errorB" class="mt-1 text-xs text-red-600">{{ errors.b }}</p>
          {% endif %}
        </div>

        <button
          type="submit"
          class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg"
        >
          Tính
        </button>
      </form>

      {% if result %}
      <section class="pt-5 border-t border-slate-100" aria-live="polite">
        <h2
          class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2"
        >
          Kết quả
        </h2>
        <p
          class="px-3 py-2 bg-slate-50 rounded-lg text-sm font-semibold text-emerald-600"
        >
          {{ result }}
        </p>
      </section>
      {% endif %}
    </main>
  </body>
</html>
